<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kristy's Cozy Flight</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2f2240;--ink:#fff3e6;--peach:#ffb88c;--butter:#ffe29a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.45);cursor:pointer;display:block}
.row{display:flex;gap:10px}
label,button{font-family:inherit;border:0;background:var(--peach);color:#4a2a3a;font-weight:600;font-size:15px;padding:9px 18px;border-radius:999px;cursor:pointer}
label:focus-within,button:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.vol{display:flex;align-items:center;gap:8px}
input[type=range]{width:110px;accent-color:#2f2240;cursor:pointer}
</style>
</head>

FfM1Vy1W0e1DYxFhywA4A5NSrcorYDc0UVq0pLU1pmlBdPgYYgUUUVxzgrnQj/2Q==";
const W=400,H=600,GROUND=540,R=22,GAP=148,PW=62;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){const s=Math.min(innerWidth/W,(innerHeight-80)/H,1.4),d=devicePixelRatio||1;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',fit);fit();

// photo
let face=null;
function setFace(src){const i=new Image();i.onload=()=>{face=i;};i.src=src;}
setFace(PHOTO_SRC,false);

// state
let best=0;try{best=+localStorage.getItem('kristy-best')||0}catch(e){}
let state='ready',bird,pipes,parts,score,t=0,off=0,toast='',toastT=0,overAt=0;
const stars=Array.from({length:30},()=>({x:Math.random()*W,y:Math.random()*300,p:Math.random()*6}));
const cheers=['so proud of you, baby','look at you go, darling','you are a cutie, baby','keep flying, darling','best pilot ever, baby'];

// music box lullaby (made in the browser, no files needed)
let ac,mg,on=true,mi=0,vol=.6;
const N={C3:130.81,G3:196,C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,G4:392};
const mel=['E5','G5','A5','G5','E5','D5','C5',0,'D5','E5','G5','E5','D5','C5','G4',0];
const bass={0:'C3',4:'G3',8:'C3',12:'G3'};
function tone(f,d,v,type){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+d);}
function startMusic(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  mg=ac.createGain();mg.gain.value=vol;mg.connect(ac.destination);
  setInterval(()=>{if(!on)return;const n=mel[mi%16];
    if(n){tone(N[n],1.1,.16,'sine');tone(N[n]*2,.5,.04,'triangle');}
    if(bass[mi%16])tone(N[bass[mi%16]],1.6,.2,'sine');mi++;},430);
}
document.getElementById('v').addEventListener('input',e=>{vol=e.target.value/100;if(mg)mg.gain.value=vol;});
document.getElementById('m').addEventListener('click',e=>{on=!on;e.target.textContent='Music: '+(on?'on':'off');if(on)startMusic();});
function reset(){bird={x:110,y:270,vy:0};pipes=[];parts=[];score=0;off=0;toast='';}
reset();
function flap(){
  startMusic();
  if(state==='ready'){state='play';bird.vy=-7.6;}
  else if(state==='play'){bird.vy=-7.6;}
  else if(state==='over'&&performance.now()-overAt>450){reset();state='ready';}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap();}});

function burst(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3-1,l:1,s:10+Math.random()*10});}
function die(){state='over';overAt=performance.now();burst(bird.x,bird.y,10);
  if(score>best){best=score;try{localStorage.setItem('kristy-best',best)}catch(e){}}}

function update(k){
  t+=k;
  if(state==='play'){
    bird.vy+=.46*k;bird.y+=bird.vy*k;off+=2.9*k;
    const last=pipes[pipes.length-1];
    if(!last||last.x<W-200)pipes.push({x:W+PW,gy:150+Math.random()*(GROUND-300),done:false});
    for(const p of pipes){p.x-=2.9*k;
      if(!p.done&&p.x+PW/2<bird.x-R){p.done=true;score++;burst(bird.x,bird.y,4);
        if(score%5===0){toast=cheers[(score/5-1)%cheers.length];toastT=140;}}
      const inX=bird.x+R-5>p.x-PW/2&&bird.x-R+5<p.x+PW/2;
      if(inX&&(bird.y-R+5<p.gy-GAP/2||bird.y+R-5>p.gy+GAP/2))die();}
    pipes=pipes.filter(p=>p.x>-PW);
    if(bird.y+R>GROUND){bird.y=GROUND-R;die();}
    if(bird.y-R<-40){bird.y=-40+R;bird.vy=0;}
  } else if(state==='ready'){bird.y=270+Math.sin(t/14)*8;}
  else if(state==='over'&&bird.y+R<GROUND){bird.vy+=.5*k;bird.y=Math.min(GROUND-R,bird.y+bird.vy*k);}
  for(const p of parts){p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.08*k;p.l-=.02*k;}
  parts=parts.filter(p=>p.l>0);
  if(toastT>0)toastT-=k;
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function draw(){
  // dusk sky
  const g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#2f2240');g.addColorStop(.55,'#7a4466');g.addColorStop(1,'#f0987c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=calm?.7:.4+.5*Math.sin(t/30+s.p);ctx.fillStyle='#fff3e6';ctx.fillRect(s.x,s.y,2,2);}
  ctx.globalAlpha=1;
  // lamp moon
  const mg=ctx.createRadialGradient(310,120,5,310,120,90);mg.addColorStop(0,'rgba(255,226,154,.9)');mg.addColorStop(1,'rgba(255,226,154,0)');
  ctx.fillStyle=mg;ctx.fillRect(210,20,200,200);ctx.fillStyle='#ffe29a';ctx.beginPath();ctx.arc(310,120,26,0,7);ctx.fill();
  // hills
  for(const [c,y,a,sp,f] of [['#5a3556',430,26,.15,.012],['#3f2a4a',470,22,.3,.017]]){
    ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8)ctx.lineTo(x,y+Math.sin((x+off*sp)*f*6)*a);
    ctx.lineTo(W,H);ctx.fill();}
  // pipes: knitted columns
  for(const p of pipes){
    const top=p.gy-GAP/2,bot=p.gy+GAP/2;
    ctx.fillStyle='#a8c5a0';rr(p.x-PW/2+5,-10,PW-10,top+10,10);ctx.fill();
    rr(p.x-PW/2+5,bot,PW-10,GROUND-bot+10,10);ctx.fill();
    ctx.strokeStyle='rgba(255,243,230,.5)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    for(const [y0,y1] of [[0,top],[bot,GROUND]]){ctx.beginPath();ctx.moveTo(p.x-8,y0);ctx.lineTo(p.x-8,y1);ctx.moveTo(p.x+8,y0);ctx.lineTo(p.x+8,y1);ctx.stroke();}
    ctx.setLineDash([]);
    ctx.fillStyle='#f2a1b3';rr(p.x-PW/2,top-26,PW,26,13);ctx.fill();rr(p.x-PW/2,bot,PW,26,13);ctx.fill();
  }
  // rug ground
  ctx.fillStyle='#7a4a5a';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#ffb88c';ctx.fillRect(0,GROUND,W,8);
  ctx.fillStyle='#f2a1b3';for(let x=-((off*1)%48);x<W;x+=48)ctx.fillRect(x,GROUND+22,24,10);
  ctx.fillStyle='#ffe29a';for(let x=-((off*1)%48)+24;x<W;x+=48)ctx.fillRect(x,GROUND+42,24,10);
  // fairy lights
  ctx.strokeStyle='#5a3556';ctx.lineWidth=2;ctx.beginPath();
  for(let x=0;x<=W;x+=10){const y=18+Math.sin(x/W*Math.PI*4)*10;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
  ['#ffe29a','#f2a1b3','#ffb88c','#a8c5a0'].forEach((c,i)=>{for(let j=0;j<4;j++){const x=25+(i+j*4)*24,y=18+Math.sin(x/W*Math.PI*4)*10+8;
    ctx.globalAlpha=calm?1:.7+.3*Math.sin(t/20+i*2+j);ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fill();}});
  ctx.globalAlpha=1;
  // bird
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.4,Math.min(.8,bird.vy*.06)));
  const fl=state==='play'?Math.sin(t*.6)*.6:Math.sin(t*.2)*.3;
  ctx.fillStyle='#ffe29a';
  for(const s of[-1,1]){ctx.save();ctx.translate(s*(R+2),2);ctx.rotate(s*(.5+fl));ctx.beginPath();ctx.ellipse(s*8,0,13,8,0,0,7);ctx.fill();ctx.restore();}
  ctx.save();ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.clip();
  if(face){ctx.drawImage(face,-R,-R,R*2,R*2);}
  else{ctx.fillStyle='#ffb88c';ctx.fillRect(-R,-R,R*2,R*2);ctx.fillStyle='#4a2a3a';
    ctx.beginPath();ctx.arc(-7,-3,2.6,0,7);ctx.arc(7,-3,2.6,0,7);ctx.fill();
    ctx.fillStyle='rgba(242,161,179,.9)';ctx.beginPath();ctx.arc(-12,5,4.5,0,7);ctx.arc(12,5,4.5,0,7);ctx.fill();
    ctx.strokeStyle='#4a2a3a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,3,6,.2,Math.PI-.2);ctx.stroke();}
  ctx.restore();
  ctx.strokeStyle='#ffe29a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
  ctx.restore();
  // hearts
  ctx.textAlign='center';
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle='#f2a1b3';ctx.font=p.s+'px Fredoka,sans-serif';ctx.fillText('\u2665',p.x,p.y);}
  ctx.globalAlpha=1;
  // text
  const T=(s,x,y,sz,c='#fff3e6',w=600)=>{ctx.font=w+' '+sz+'px Fredoka,system-ui,sans-serif';ctx.fillStyle=c;ctx.fillText(s,x,y);};
  if(state==='play'){T(score,W/2,95,56);if(toastT>0){ctx.globalAlpha=Math.min(1,toastT/30);T(toast,W/2,135,20,'#ffe29a');ctx.globalAlpha=1;}}
  if(state==='ready'){T("Kristy's cozy flight",W/2,170,34);T('tap to flap, baby',W/2,208,19,'#ffe29a',400);
    if(Math.floor(t/30)%2===0)T('tap to start',W/2,370,18,'#fff3e6',400);}
  if(state==='over'){
    ctx.fillStyle='rgba(47,34,64,.88)';rr(60,125,280,320,26);ctx.fill();
    ctx.save();ctx.beginPath();ctx.arc(W/2,200,58,0,7);ctx.clip();
    if(overImg.complete&&overImg.naturalWidth)ctx.drawImage(overImg,W/2-58,142,116,116);ctx.restore();
    ctx.strokeStyle='#ffe29a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2,200,58,0,7);ctx.stroke();
    T('oh no, darling',W/2,303,28);T('hearts: '+score,W/2,341,24,'#ffe29a');
    T('best: '+best,W/2,369,18,'#ffb88c',400);T('tap to try again',W/2,410,17,'#fff3e6',400);}
}
let last=performance.now();
(function loop(n){const k=Math.min(2.5,(n-last)/16.67);last=n;update(k);draw();requestAnimationFrame(loop);})(last);
</script>
